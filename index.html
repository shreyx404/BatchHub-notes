<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BatchHub Notes Archive</title>
<meta name="description" content="Centralized archive of academic notes for BatchHub — browse, search, and copy links for instant integration.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #08080a;
    --surface: #0f0f12;
    --surface2: #151519;
    --surface3: #1a1a1f;
    --border: #222228;
    --border2: #2c2c34;
    --text: #e4e4e8;
    --text-dim: #8a8a96;
    --text-dimmer: #4a4a56;
    --accent: #f5f5f7;
    --warm: #e8c47c;
    --warm-dim: #c4a060;
    --warm-bg: rgba(232,196,124,0.06);
    --warm-border: rgba(232,196,124,0.15);
    --success: #5cb878;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'IBM Plex Sans', sans-serif;
    --radius: 8px;
    --radius-lg: 12px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.6;
    font-weight: 400;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ─── LAYOUT ─── */
  .container {
    max-width: 1080px;
    margin: 0 auto;
    padding: 0 32px;
  }

  /* ─── HEADER ─── */
  .header {
    padding: 56px 0 48px;
    border-bottom: 1px solid var(--border);
  }
  .header-eyebrow {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.16em;
    color: var(--text-dimmer);
    text-transform: uppercase;
    margin-bottom: 20px;
  }
  .header-eyebrow .dot {
    width: 6px;
    height: 6px;
    background: var(--warm);
    border-radius: 50%;
    animation: pulse-dot 2.5s ease-in-out infinite;
  }
  @keyframes pulse-dot {
    0%, 100% { opacity: 0.4; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.3); }
  }
  .header h1 {
    font-size: 38px;
    font-weight: 700;
    letter-spacing: -0.03em;
    color: var(--accent);
    line-height: 1.1;
    margin-bottom: 14px;
  }
  .header-sub {
    font-size: 15px;
    color: var(--text-dim);
    font-weight: 300;
    max-width: 560px;
    line-height: 1.65;
  }
  .header-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 20px;
    padding: 6px 14px;
    background: var(--warm-bg);
    border: 1px solid var(--warm-border);
    border-radius: 20px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--warm);
    letter-spacing: 0.04em;
  }
  .header-badge .count {
    font-weight: 600;
    font-size: 13px;
  }

  /* ─── CONTROLS ─── */
  .controls {
    padding: 28px 0;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .search-wrap {
    position: relative;
  }
  .search-wrap svg {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-dimmer);
    pointer-events: none;
  }
  .search-input {
    width: 100%;
    padding: 13px 18px 13px 46px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 400;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .search-input::placeholder { color: var(--text-dimmer); }
  .search-input:focus {
    border-color: var(--warm-border);
    box-shadow: 0 0 0 3px rgba(232,196,124,0.06);
  }

  /* ─── FILTER PILLS ─── */
  .filter-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .filter-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.12em;
    color: var(--text-dimmer);
    text-transform: uppercase;
    margin-right: 4px;
  }
  .pill {
    padding: 5px 14px;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: transparent;
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.04em;
    cursor: pointer;
    transition: all 0.2s;
    user-select: none;
  }
  .pill:hover {
    border-color: var(--border2);
    color: var(--text);
    background: var(--surface2);
  }
  .pill.active {
    background: var(--warm-bg);
    border-color: var(--warm-border);
    color: var(--warm);
  }

  /* ─── NOTES GRID ─── */
  .notes-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 16px;
    padding: 8px 0 80px;
  }
  .note-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    transition: border-color 0.25s, transform 0.25s, box-shadow 0.25s;
    animation: cardIn 0.4s ease-out both;
  }
  .note-card:hover {
    border-color: var(--border2);
    transform: translateY(-2px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card-top {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .subject-badge {
    padding: 3px 10px;
    border-radius: 4px;
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    background: var(--surface3);
    border: 1px solid var(--border2);
    color: var(--warm);
  }
  .unit-label {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-dimmer);
    letter-spacing: 0.06em;
  }

  .card-title {
    font-size: 17px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: -0.01em;
    line-height: 1.35;
  }
  .card-summary {
    font-size: 13px;
    color: var(--text-dim);
    font-weight: 300;
    line-height: 1.6;
    flex: 1;
  }

  .card-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .tag {
    padding: 2px 8px;
    background: var(--surface3);
    border-radius: 4px;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-dimmer);
    letter-spacing: 0.03em;
  }

  .card-actions {
    display: flex;
    gap: 8px;
    padding-top: 4px;
    border-top: 1px solid var(--border);
    margin-top: auto;
  }
  .btn {
    flex: 1;
    padding: 9px 16px;
    border-radius: 6px;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.04em;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    border: none;
  }
  .btn-read {
    background: var(--accent);
    color: var(--bg);
  }
  .btn-read:hover {
    background: #fff;
    box-shadow: 0 2px 12px rgba(245,245,247,0.15);
  }
  .btn-copy {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
  }
  .btn-copy:hover {
    border-color: var(--warm-border);
    color: var(--warm);
    background: var(--warm-bg);
  }
  .btn-copy.copied {
    border-color: rgba(92,184,120,0.3);
    color: var(--success);
    background: rgba(92,184,120,0.06);
  }

  /* ─── EMPTY STATE ─── */
  .empty-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 80px 20px;
  }
  .empty-state .icon {
    font-size: 48px;
    margin-bottom: 16px;
    opacity: 0.3;
  }
  .empty-state h3 {
    font-size: 16px;
    font-weight: 500;
    color: var(--text-dim);
    margin-bottom: 6px;
  }
  .empty-state p {
    font-size: 13px;
    color: var(--text-dimmer);
  }

  /* ─── TOAST ─── */
  .toast {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    padding: 12px 24px;
    background: var(--surface2);
    border: 1px solid rgba(92,184,120,0.3);
    border-radius: var(--radius);
    font-family: var(--mono);
    font-size: 12px;
    color: var(--success);
    display: flex;
    align-items: center;
    gap: 8px;
    pointer-events: none;
    opacity: 0;
    transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 1000;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ─── FOOTER ─── */
  .footer {
    border-top: 1px solid var(--border);
    padding: 32px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dimmer);
    letter-spacing: 0.04em;
  }
  .footer a {
    color: var(--warm-dim);
    text-decoration: none;
    transition: color 0.2s;
  }
  .footer a:hover { color: var(--warm); }

  /* ─── RESPONSIVE ─── */
  @media (max-width: 768px) {
    .search-input {
      font-size: 16px; /* Prevents iOS Safari auto-zoom on input focus */
    }
  }

  @media (max-width: 640px) {
    .container { padding: 0 16px; }
    .header { padding: 36px 0 28px; }
    .header h1 { font-size: clamp(24px, 7vw, 32px); }
    .notes-grid { grid-template-columns: 1fr; gap: 16px; }
    .note-card { padding: 20px; }
    .card-actions { flex-direction: column; }
    .btn { min-height: 40px; }
    .pill { min-height: 32px; padding: 6px 14px; }
    .footer { flex-direction: column; gap: 8px; text-align: center; }
  }
</style>
</head>
<body>

<div class="container">

  <!-- ─── HEADER ─── -->
  <header class="header">
    <div class="header-eyebrow">
      <span class="dot"></span>
      <span>BatchHub · Notes Archive</span>
    </div>
    <h1>Notes Archive</h1>
    <p class="header-sub">
      Centralized repository of formatted academic notes. Search, preview, and copy direct links for instant integration into BatchHub.
    </p>
    <div class="header-badge">
      <span class="count" id="noteCount">—</span>
      <span>notes published</span>
    </div>
  </header>

  <!-- ─── CONTROLS ─── -->
  <div class="controls">
    <div class="search-wrap">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" class="search-input" id="searchInput" placeholder="Search notes by title, subject, unit, or tag…">
    </div>
    <div class="filter-row" id="filterRow">
      <span class="filter-label">Subject</span>
      <button class="pill active" data-filter="all">All</button>
    </div>
  </div>

  <!-- ─── NOTES GRID ─── -->
  <div class="notes-grid" id="notesGrid">
    <div class="empty-state">
      <div class="icon">📄</div>
      <h3>Loading notes…</h3>
      <p>Fetching manifest</p>
    </div>
  </div>

  <!-- ─── FOOTER ─── -->
  <footer class="footer">
    <span>BatchHub Notes Archive</span>
    <a href="https://batch-hub-red.vercel.app" target="_blank">Open BatchHub →</a>
  </footer>

</div>

<!-- ─── TOAST ─── -->
<div class="toast" id="toast">
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
  <span id="toastMsg">Link copied!</span>
</div>

<script>
(function () {
  const BASE_URL = 'https://shreyx404.github.io/BatchHub-notes';
  const grid = document.getElementById('notesGrid');
  const searchInput = document.getElementById('searchInput');
  const filterRow = document.getElementById('filterRow');
  const noteCountEl = document.getElementById('noteCount');
  const toast = document.getElementById('toast');
  const toastMsg = document.getElementById('toastMsg');

  let allNotes = [];
  let activeFilter = 'all';
  let searchQuery = '';

  // ── Fetch manifest ──
  fetch('notes.json')
    .then(r => r.json())
    .then(notes => {
      allNotes = notes;
      noteCountEl.textContent = notes.length;
      buildFilters(notes);
      renderNotes();
    })
    .catch(() => {
      grid.innerHTML = `
        <div class="empty-state">
          <div class="icon">⚠️</div>
          <h3>Could not load notes.json</h3>
          <p>Run <code>npm run build</code> to generate the manifest.</p>
        </div>`;
    });

  // ── Build subject filter pills ──
  function buildFilters(notes) {
    const subjects = [...new Set(notes.map(n => n.subject))].sort();
    for (const subj of subjects) {
      const pill = document.createElement('button');
      pill.className = 'pill';
      pill.dataset.filter = subj;
      pill.textContent = subj;
      filterRow.appendChild(pill);
    }
  }

  // ── Render notes grid ──
  function renderNotes() {
    const q = searchQuery.toLowerCase();
    const filtered = allNotes.filter(note => {
      if (activeFilter !== 'all' && note.subject !== activeFilter) return false;
      if (!q) return true;
      const haystack = [note.title, note.subject, note.unit, note.summary, ...note.tags].join(' ').toLowerCase();
      return haystack.includes(q);
    });

    if (filtered.length === 0) {
      grid.innerHTML = `
        <div class="empty-state">
          <div class="icon">🔍</div>
          <h3>No notes found</h3>
          <p>Try adjusting your search or filter.</p>
        </div>`;
      return;
    }

    grid.innerHTML = filtered.map((note, i) => `
      <div class="note-card" style="animation-delay: ${i * 0.06}s">
        <div class="card-top">
          <span class="subject-badge">${esc(note.subject)}</span>
          <span class="unit-label">${esc(note.unit)}</span>
        </div>
        <div class="card-title">${esc(note.title)}</div>
        <div class="card-summary">${esc(note.summary)}</div>
        ${note.tags.length ? `<div class="card-tags">${note.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>` : ''}
        <div class="card-actions">
          <a class="btn btn-read" href="${esc(note.path)}" target="_blank">Read Notes</a>
          <button class="btn btn-copy" data-url="${esc(note.url)}" onclick="copyLink(this)">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
            Copy Link
          </button>
        </div>
      </div>
    `).join('');
  }

  function esc(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  // ── Copy link handler ──
  window.copyLink = function (btn) {
    const url = btn.dataset.url;
    navigator.clipboard.writeText(url).then(() => {
      btn.classList.add('copied');
      btn.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg> Copied!`;
      showToast(`Copied: ${url}`);
      setTimeout(() => {
        btn.classList.remove('copied');
        btn.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg> Copy Link`;
      }, 2500);
    });
  };

  // ── Toast ──
  function showToast(msg) {
    toastMsg.textContent = msg;
    toast.classList.add('show');
    clearTimeout(showToast._timer);
    showToast._timer = setTimeout(() => toast.classList.remove('show'), 3000);
  }

  // ── Search ──
  searchInput.addEventListener('input', (e) => {
    searchQuery = e.target.value;
    renderNotes();
  });

  // ── Filter pills ──
  filterRow.addEventListener('click', (e) => {
    const pill = e.target.closest('.pill');
    if (!pill) return;
    filterRow.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
    pill.classList.add('active');
    activeFilter = pill.dataset.filter;
    renderNotes();
  });
})();
</script>

</body>
</html>
